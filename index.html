  <title>Training dairy</title>

  <div class="sidebar">
    <h1 class="header">Training dairy</h1>

    <ul class="workouts">
      <form class="form hidden">
        <div class="form__row">
          <label class="form__label">Type</label>
          <select class="form__input form__input--type">
            <option value="running">Run</option>
            <option value="cycling">Bicycle</option>
          </select>
        </div>
        <div class="form__row">
          <label class="form__label">Distance</label>
          <input class="form__input form__input--distance" placeholder="км" />
        </div>
        <div class="form__row">
          <label class="form__label">Duration</label>
          <input class="form__input form__input--duration" placeholder="min" />
        </div>
        <div class="form__row">
          <label class="form__label">Temp</label>
          <input class="form__input form__input--cadence" placeholder="steps per min" />
        </div>
        <div class="form__row form__row--hidden">
          <label class="form__label">Height</label>
          <input class="form__input form__input--elevation" placeholder="metres" />
        </div>
        <button class="form__btn">OK</button>
      </form>
